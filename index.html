<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小风剧场</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/hls.min.js"></script>
</head>
<body>
  <!-- 自定义标题栏 -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <span class="logo">💨 小风剧场</span>
    </div>
    <div class="titlebar-controls">
      <button class="ctl-btn" id="btn-minimize">─</button>
      <button class="ctl-btn" id="btn-maximize"><span class="btn-icon btn-icon-max"></span></button>
      <button class="ctl-btn ctl-close" id="btn-close">✕</button>
    </div>
  </div>

  <div class="app-layout" id="app-layout">
    <nav class="sidebar">
      <ul class="nav-list">
        <li class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span class="nav-text">首页</span></li>
        <li class="nav-item" data-page="domestic"><span class="nav-icon">🇨🇳</span><span class="nav-text">国产剧</span></li>
        <li class="nav-item" data-page="us"><span class="nav-icon">🇺🇸</span><span class="nav-text">美剧</span></li>
        <li class="nav-item" data-page="international"><span class="nav-icon">🌍</span><span class="nav-text">海外剧</span></li>
        <li class="nav-item" data-page="search"><span class="nav-icon">📋</span><span class="nav-text">历史记录</span></li>
      </ul>
    </nav>

    <main class="content">
      <section id="page-home" class="page active">
        <div class="global-search">
          <span class="gs-icon">🔍</span>
          <input type="text" id="home-search-input" placeholder="搜索剧名、演员…">
          <button class="btn btn-search gs-btn" onclick="doSearchFromHome()">搜索</button>
        </div>
        <div class="hero" id="hero">
          <div class="hero-overlay"></div>
          <div class="hero-info">
            <h1 class="hero-title">小风剧场</h1>
            <p class="hero-desc">一起看剧吧 💨</p>
            <div class="hero-actions">
              <button class="btn btn-play" id="hero-play-btn" style="display:none">▶ 播放</button>
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-header"><h2>🔥 热门剧集</h2></div>
          <div class="card-grid" id="trending-grid"></div>
        </div>
        <div class="section">
          <div class="section-header"><h2>⭐ 高分推荐</h2></div>
          <div class="card-grid" id="top-rated-grid"></div>
        </div>
      </section>

      <section id="page-domestic" class="page">
        <div class="section">
          <div class="section-header"><h2>🇨🇳 国产剧</h2></div>
          <div class="filter-bar" data-t="13">
            <button class="filter-btn active" data-class="">全部</button>
            <button class="filter-btn" data-class="古装">古装</button>
            <button class="filter-btn" data-class="剧情">剧情</button>
            <button class="filter-btn" data-class="悬疑">悬疑</button>
            <button class="filter-btn" data-class="喜剧">喜剧</button>
          </div>
          <div class="card-grid" id="domestic-grid"></div>
        </div>
      </section>

      <section id="page-us" class="page">
        <div class="section">
          <div class="section-header"><h2>🇺🇸 美剧</h2></div>
          <div class="filter-bar" data-t="16">
            <button class="filter-btn active" data-class="">全部</button>
            <button class="filter-btn" data-class="科幻">科幻</button>
            <button class="filter-btn" data-class="悬疑">悬疑</button>
            <button class="filter-btn" data-class="喜剧">喜剧</button>
            <button class="filter-btn" data-class="奇幻">奇幻</button>
          </div>
          <div class="card-grid" id="us-grid"></div>
        </div>
      </section>

      <section id="page-international" class="page">
        <div class="section">
          <div class="section-header"><h2>🌍 海外剧</h2></div>
          <div class="filter-bar" data-t="15,22,23">
            <button class="filter-btn active" data-t="">全部</button>
            <button class="filter-btn" data-t="22">日剧</button>
            <button class="filter-btn" data-t="15">韩剧</button>
            <button class="filter-btn" data-t="23">英剧</button>
            <button class="filter-btn" data-t="">其他</button>
          </div>
          <div class="card-grid" id="international-grid"></div>
        </div>
      </section>

      <section id="page-search" class="page">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="搜索剧名、演员、导演…">
          <button class="btn btn-search">搜索</button>
        </div>
        <div class="card-grid" id="search-results"></div>
      </section>
    </main>
  </div>

  <!-- 播放页 -->
  <div class="player-page" id="player-page" style="display:none">
    <div class="player-header">
      <div class="ph-left">
        <span class="logo">💨 小风剧场</span>
        <button class="player-back" id="player-back-btn">← 返回</button>
        <span class="player-title" id="player-title">正在播放</span>
      </div>
      <div class="ph-right titlebar-controls">
        <button class="ctl-btn" id="ph-btn-minimize">─</button>
        <button class="ctl-btn" id="ph-btn-maximize"><span class="btn-icon btn-icon-max"></span></button>
        <button class="ctl-btn ctl-close" id="ph-btn-close">✕</button>
      </div>
    </div>
    <div class="player-main">
      <div class="player-left">
        <div class="video-wrapper" id="video-wrapper">
          <video id="video-player" controls controlslist="nofullscreen nodownload noremoteplayback" autoplay></video>
        </div>
        <div class="video-info" id="video-info">
          <div class="vi-title" id="vi-title"></div>
          <div class="vi-meta" id="vi-meta"></div>
        </div>
      </div>
      <div class="player-right">
        <div class="pr-header"><span>📋 选集</span><span class="pr-count" id="ep-count"></span></div>
        <div class="episode-grid" id="episode-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // 最大化图标切换（CSS 画方框）
    function setMaxIcons(maximized) {
      document.querySelectorAll('.btn-icon-max').forEach(el => {
        if (maximized) {
          el.classList.add('restore');
          el.innerHTML = '<span class="r1"></span><span class="r2"></span>';
        } else {
          el.classList.remove('restore');
          el.innerHTML = '';
        }
      });
    }
    if (window.electronAPI?.onWindowStateChange) {
      window.electronAPI.onWindowStateChange(s => setMaxIcons(s.maximized));
    }

    // 按钮绑定
    ['btn','ph-btn'].forEach(prefix => {
      ['minimize','maximize','close'].forEach(action => {
        const el = document.getElementById(prefix + '-' + action);
        if (el) el.onclick = () => window.electronAPI?.[action]();
      });
    });

    // 全屏状态同步
    if (window.electronAPI?.onFullScreenChange) {
      window.electronAPI.onFullScreenChange((state) => {
        const pp = document.getElementById('player-page');
        if (!pp || pp.style.display === 'none') return;
        const h = document.querySelector('.player-header');
        const r = document.querySelector('.player-right');
        const vi = document.getElementById('video-info');
        const v = document.getElementById('video-player');
        if (state.fullscreen) {
          if (h) h.style.display = 'none';
          if (r) r.style.display = 'none';
          if (vi) vi.style.display = 'none';
          if (v) v.style.objectFit = 'cover';
        } else {
          if (h) h.style.display = '';
          if (r) r.style.display = '';
          if (vi) vi.style.display = '';
          if (v) v.style.objectFit = '';
        }
      });
    }
  </script>
  <script src="renderer.js"></script>
</body>
</html>
